# Placeholder TLS for Gateway HTTPS listeners during dual-run.
# Per-hostname Let's Encrypt secrets attach in Phase 3+ (hostname-scoped listeners).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-edge-tls
  namespace: kgateway-system
spec:
  secretName: gateway-edge-tls
  issuerRef:
    name: selfsigned
    kind: Issuer
    group: cert-manager.io
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
  dnsNames:
    - gateway.home.bradandmarsha.com
