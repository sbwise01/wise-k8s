apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-public
  namespace: kgateway-system
  annotations:
    # external-dns v0.20 reads target from Gateway (not HTTPRoute).
    # Keep public CNAMEs → apex (WAN A via route53-ddns).
    # Without this, gateway-httproute would publish A → MetalLB VIP (.217).
    external-dns.alpha.kubernetes.io/target: home.bradandmarsha.com
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      name: gateway-public
      group: gateway.kgateway.dev
      kind: GatewayParameters
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # One HTTPS listener (no hostname). Splitting wildcard vs apex on the same
    # VIP + cert lets Chrome HTTP/2-coalesce; SNI stays apex and subdomains 404.
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-home-tls
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
