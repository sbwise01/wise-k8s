apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-public
  namespace: kgateway-system
  annotations:
    # external-dns v0.20 reads target from Gateway (not HTTPRoute).
    # Keep public CNAMEs → apex (WAN A via route53-ddns), same as Ingress today.
    # Without this, gateway-httproute would publish A → MetalLB VIP (.217).
    external-dns.alpha.kubernetes.io/target: home.bradandmarsha.com
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      name: gateway-public
      group: gateway.kgateway.dev
      kind: GatewayParameters
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Hostname-agnostic placeholder (self-signed) for L2 smoke / unmatched SNI.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-edge-tls
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
    # Phase 3 canary — Let's Encrypt secret lives in default (see ReferenceGrant there).
    - name: https-flask-hello-world
      protocol: HTTPS
      port: 443
      hostname: flask-hello-world.home.bradandmarsha.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate-flask-hello-world
            namespace: default
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
    - name: https-media
      protocol: HTTPS
      port: 443
      hostname: media.home.bradandmarsha.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate-media
            namespace: default
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
    - name: https-oidc
      protocol: HTTPS
      port: 443
      hostname: oidc.home.bradandmarsha.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate-aws-iam-oidc
            namespace: default
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
    - name: https-plex
      protocol: HTTPS
      port: 443
      hostname: plex.home.bradandmarsha.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: plex-certificate
            namespace: default
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: auth.home.bradandmarsha.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: keycloak-certificate
            namespace: keycloak
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
    - name: https-acruet
      protocol: HTTPS
      port: 443
      hostname: acruet.home.bradandmarsha.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: acruet-user-certificate
            namespace: acruet
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
    - name: https-home
      protocol: HTTPS
      port: 443
      hostname: home.bradandmarsha.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate-wise-home-index
            namespace: default
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
