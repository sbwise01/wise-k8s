apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-public
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      name: gateway-public
      group: gateway.kgateway.dev
      kind: GatewayParameters
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # Hostname-agnostic placeholder (self-signed) for L2 smoke / unmatched SNI.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-edge-tls
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
    # Phase 3 canary — Let's Encrypt secret lives in default (see ReferenceGrant there).
    - name: https-flask-hello-world
      protocol: HTTPS
      port: 443
      hostname: flask-hello-world.home.bradandmarsha.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate-flask-hello-world
            namespace: default
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
