apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-internal
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      name: gateway-internal
      group: gateway.kgateway.dev
      kind: GatewayParameters
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.home.bradandmarsha.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-home-tls
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: All
