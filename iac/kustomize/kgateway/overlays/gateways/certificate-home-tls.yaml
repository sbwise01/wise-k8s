# Platform TLS for frozen Gateway listeners (Phase 8).
# Wildcard does not cover the apex — both SANs required.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-home-tls
  namespace: kgateway-system
spec:
  secretName: gateway-home-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
    - bradandmarsha
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
  dnsNames:
    - '*.home.bradandmarsha.com'
    - home.bradandmarsha.com
