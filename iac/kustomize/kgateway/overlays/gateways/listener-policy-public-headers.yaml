# Keycloak (and other OIDC) tokens can exceed Envoy's 60KiB default.
# Matches nginx.ingress.kubernetes.io/proxy-buffer-size: 128k on auth Ingress.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: gateway-public-http-headers
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-public
  default:
    httpSettings:
      maxRequestHeadersKb: 128
