apiVersion: v1
kind: Service
metadata:
  name: acruet-admin
  namespace: acruet
  labels:
    app: acruet-admin
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: acruet-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acruet-admin
  namespace: acruet
  labels:
    app: acruet-admin
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acruet-admin
      version: v1
  template:
    metadata:
      labels:
        app: acruet-admin
        version: v1
    spec:
      containers:
        - name: acruet-admin
          image: sbwise/acruet-admin:0.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ACRUET_DB_HOST
              value: acruet-db-rw.acruet-cnpg.svc
            - name: ACRUET_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: acruet-db-app
                  key: port
            - name: ACRUET_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: acruet-db-app
                  key: dbname
            - name: ACRUET_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: acruet-db-app
                  key: username
            - name: ACRUET_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acruet-db-app
                  key: password
            - name: ACRUET_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: acruet-oidc
                  key: client-id
            - name: ACRUET_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: acruet-oidc
                  key: client-secret
            - name: ACRUET_AUTH_HOST
              value: auth.home.bradandmarsha.com
            - name: ACRUET_BASE_URL
              value: https://acruet-admin.home.bradandmarsha.com
            - name: ACRUET_MEDIA_HOST
              value: media.home.bradandmarsha.com
            - name: ACRUET_REQUIRE_ADMIN_ROLE
              value: "true"
            - name: ACRUET_KEYCLOAK_ADMIN_CLIENT_ID
              value: acruet-admin
            - name: ACRUET_KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: acruet-admin-api
                  key: client-secret
            - name: ACRUET_USER_BASE_URL
              value: https://acruet.home.bradandmarsha.com
            - name: ACRUET_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: acruet-smtp
                  key: host
            - name: ACRUET_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: acruet-smtp
                  key: port
            - name: ACRUET_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: acruet-smtp
                  key: username
            - name: ACRUET_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acruet-smtp
                  key: password
            - name: ACRUET_SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: acruet-smtp
                  key: from
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 1Gi
