apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: acruet-admin-certificate
  namespace: acruet
spec:
  secretName: acruet-admin-certificate
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
      - bradandmarsha
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
  dnsNames:
    - acruet-admin.home.bradandmarsha.com
