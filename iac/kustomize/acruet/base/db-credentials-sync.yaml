# CNPG creates Secret acruet-db-app in acruet-cnpg. Deployments expect the
# secret in the acruet namespace. Mirror here until a cluster-wide reflector
# or ExternalSecrets pattern exists.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acruet-db-credentials-sync
  namespace: acruet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acruet-db-credentials-write
  namespace: acruet
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acruet-db-credentials-write
  namespace: acruet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acruet-db-credentials-write
subjects:
  - kind: ServiceAccount
    name: acruet-db-credentials-sync
    namespace: acruet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acruet-db-credentials-read
  namespace: acruet-cnpg
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["acruet-db-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acruet-db-credentials-read
  namespace: acruet-cnpg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acruet-db-credentials-read
subjects:
  - kind: ServiceAccount
    name: acruet-db-credentials-sync
    namespace: acruet
---
apiVersion: batch/v1
kind: Job
metadata:
  name: acruet-db-credentials-sync-bootstrap
  namespace: acruet
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: acruet-db-credentials-sync
      containers:
        - name: sync
          image: alpine/k8s:1.36.1
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              SRC_NS=acruet-cnpg
              DST_NS=acruet
              SECRET=acruet-db-app
              args=()
              while IFS= read -r key; do
                [ -z "$key" ] && continue
                val=$(kubectl get secret "$SECRET" -n "$SRC_NS" -o "jsonpath={.data.${key}}" | base64 -d)
                args+=(--from-literal="${key}=${val}")
              done < <(kubectl get secret "$SECRET" -n "$SRC_NS" -o go-template='{{range $k,$v := .data}}{{$k}}{{"\n"}}{{end}}')
              kubectl create secret generic "$SECRET" -n "$DST_NS" "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: acruet-db-credentials-sync
  namespace: acruet
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: acruet-db-credentials-sync
          containers:
            - name: sync
              image: alpine/k8s:1.36.1
              command:
                - /bin/bash
                - -ec
                - |
                  set -euo pipefail
                  SRC_NS=acruet-cnpg
                  DST_NS=acruet
                  SECRET=acruet-db-app
                  args=()
                  while IFS= read -r key; do
                    [ -z "$key" ] && continue
                    val=$(kubectl get secret "$SECRET" -n "$SRC_NS" -o "jsonpath={.data.${key}}" | base64 -d)
                    args+=(--from-literal="${key}=${val}")
                  done < <(kubectl get secret "$SECRET" -n "$SRC_NS" -o go-template='{{range $k,$v := .data}}{{$k}}{{"\n"}}{{end}}')
                  kubectl create secret generic "$SECRET" -n "$DST_NS" "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -
