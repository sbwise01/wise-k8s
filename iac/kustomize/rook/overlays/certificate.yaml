apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ceph-dashboard-selfsigned-cert
  namespace: rook-ceph
spec:
  secretName: ceph-dashboard-selfsigned-cert
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  commonName: "ceph-dashboard"
  dnsNames:
  - "ceph-dashboard"
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
