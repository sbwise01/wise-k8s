# Ceph mgr dashboard serves HTTPS with a cluster-internal cert (nginx
# backend-protocol: HTTPS + proxy-ssl-verify: off). Gateway API BackendTLSPolicy
# requires a CA; skip verify here matches that ingress-nginx exception.
#
# Envoy stats after cutover: ssl.handshake=0, ssl.connection_error>0. Ceph
# dashboard accepts TLS 1.3 (curl --tlsv1.3) and rejects TLS 1.2. TLS 1.3
# effectively requires SNI; omitting it produced 503 "remote connection
# failure". Do not set ALPN — http/1.1-only ALPN with SNI also 503'd.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: ceph-dashboard-backend-tls
  namespace: rook-ceph
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: rook-ceph-mgr-dashboard
  tls:
    insecureSkipVerify: true
    simpleTLS: true
    sni: rook-ceph-mgr-dashboard.rook-ceph.svc
    parameters:
      minVersion: "1.2"
      maxVersion: "1.3"
