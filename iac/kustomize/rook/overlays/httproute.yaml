apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
  annotations:
    index.home.bradandmarsha.com/enabled: "true"
    index.home.bradandmarsha.com/name: "Ceph Dashboard"
    index.home.bradandmarsha.com/image: "https://media.home.bradandmarsha.com/media/ceph.svg"
    index.home.bradandmarsha.com/description: "Rook-Ceph storage cluster management UI"
    index.home.bradandmarsha.com/weight: "30"
spec:
  parentRefs:
    - name: gateway-internal
      namespace: kgateway-system
      sectionName: https-ceph-dashboard
  hostnames:
    - ceph-dashboard.home.bradandmarsha.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rook-ceph-mgr-dashboard
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard-https-redirect
  namespace: rook-ceph
spec:
  parentRefs:
    - name: gateway-internal
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - ceph-dashboard.home.bradandmarsha.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
