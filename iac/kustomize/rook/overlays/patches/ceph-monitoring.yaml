# Phase 1: enable Rook monitoring integration with kube-prometheus-stack.
# ServiceMonitors get release: prometheus-stack via spec.labels.monitoring.
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  monitoring:
    enabled: true
  labels:
    monitoring:
      release: prometheus-stack
