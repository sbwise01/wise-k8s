# Break-glass static AWS keys. Create Secret cert-manager/cert-manager-aws
# by hand (not in git) with keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
# IRSA is off until oidc.home.bradandmarsha.com TLS is healthy again.
- op: add
  path: /spec/template/spec/containers/0/envFrom
  value:
    - secretRef:
        name: cert-manager-aws
