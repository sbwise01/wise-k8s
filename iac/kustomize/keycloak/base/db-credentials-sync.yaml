# CNPG creates Secret keycloak-db-app in keycloak-cnpg. The Keycloak Operator
# expects usernameSecret/passwordSecret in the Keycloak CR namespace. Mirror the
# secret here until a cluster-wide reflector or ExternalSecrets pattern exists.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-db-credentials-sync
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-db-credentials-write
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-db-credentials-write
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-db-credentials-write
subjects:
  - kind: ServiceAccount
    name: keycloak-db-credentials-sync
    namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-db-credentials-read
  namespace: keycloak-cnpg
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-db-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-db-credentials-read
  namespace: keycloak-cnpg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-db-credentials-read
subjects:
  - kind: ServiceAccount
    name: keycloak-db-credentials-sync
    namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-credentials-sync-bootstrap
  namespace: keycloak
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keycloak-db-credentials-sync
      containers:
        - name: sync
          image: alpine/k8s:1.36.1
          command:
            - /bin/bash
            - -ec
            - |
              kubectl get secret keycloak-db-app -n keycloak-cnpg -o yaml \
                | sed -e 's/namespace: keycloak-cnpg/namespace: keycloak/' \
                | grep -v '^\s*resourceVersion:' \
                | grep -v '^\s*uid:' \
                | grep -v '^\s*creationTimestamp:' \
                | kubectl apply -n keycloak -f -
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-db-credentials-sync
  namespace: keycloak
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: keycloak-db-credentials-sync
          containers:
            - name: sync
              image: alpine/k8s:1.36.1
              command:
                - /bin/bash
                - -ec
                - |
                  kubectl get secret keycloak-db-app -n keycloak-cnpg -o yaml \
                    | sed -e 's/namespace: keycloak-cnpg/namespace: keycloak/' \
                    | grep -v '^\s*resourceVersion:' \
                    | grep -v '^\s*uid:' \
                    | grep -v '^\s*creationTimestamp:' \
                    | kubectl apply -n keycloak -f -
