apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    index.home.bradandmarsha.com/enabled: "true"
    index.home.bradandmarsha.com/name: "Keycloak"
    index.home.bradandmarsha.com/image: "https://media.home.bradandmarsha.com/media/keycloak.png"
    index.home.bradandmarsha.com/description: "OIDC/OAuth2 identity provider for homelab apps"
    index.home.bradandmarsha.com/weight: "25"
spec:
  parentRefs:
    - name: gateway-public
      namespace: kgateway-system
      sectionName: https-auth
  hostnames:
    - auth.home.bradandmarsha.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak-service
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-https-redirect
  namespace: keycloak
spec:
  parentRefs:
    - name: gateway-public
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - auth.home.bradandmarsha.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
