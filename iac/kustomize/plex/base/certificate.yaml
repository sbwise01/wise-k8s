apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plex-certificate
spec:
  secretName: plex-certificate
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
    - bradandmarsha
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
  # At least one of a DNS Name, URI, or IP address is required.
  # Internal names kept to enable independent testing through ingress lb
  dnsNames:
  - 'plex.home.bradandmarsha.com'
