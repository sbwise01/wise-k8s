apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - ../base/0.91.0
  - certificate.yaml

patches:
  - target:
      kind: Ingress
      name: prometheus-stack-grafana
    path: patches/ingress.yaml
  - target:
      kind: Deployment
      name: prometheus-stack-grafana
    path: patches/grafana-domain.yaml
