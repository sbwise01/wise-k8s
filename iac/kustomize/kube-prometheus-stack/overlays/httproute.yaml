apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-dashboard
  namespace: monitoring
  annotations:
    index.home.bradandmarsha.com/enabled: "true"
    index.home.bradandmarsha.com/name: "Grafana Dashboard"
    index.home.bradandmarsha.com/image: "https://media.home.bradandmarsha.com/media/grafana.jpg"
    index.home.bradandmarsha.com/description: "Metrics and observability dashboards"
    index.home.bradandmarsha.com/weight: "40"
spec:
  parentRefs:
    - name: gateway-internal
      namespace: kgateway-system
      sectionName: https-wildcard
  hostnames:
    - grafana-dashboard.home.bradandmarsha.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-dashboard-https-redirect
  namespace: monitoring
spec:
  parentRefs:
    - name: gateway-internal
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - grafana-dashboard.home.bradandmarsha.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
