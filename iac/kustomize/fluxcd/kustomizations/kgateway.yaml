apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kgateway
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./iac/kustomize/kgateway/overlays
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # MetalLB assigns VIP for Gateway LoadBalancer Services; cert-manager issues
  # TLS secrets. lets-encrypt provides ClusterIssuer letsencrypt-prod for the
  # platform wildcard/apex Certificate.
  dependsOn:
    - name: metal-lb
    - name: cert-manager
    - name: lets-encrypt
