apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kgateway
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./iac/kustomize/kgateway/overlays
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # MetalLB not required until Phase 2 Gateways create LoadBalancer Services;
  # depend anyway so edge stack order is explicit in Flux.
  dependsOn:
    - name: metal-lb
