# IRSA for SOPS KMS decryption (wise-k8s/iac/terraform/iam_flux_sops.tf).
# Applied to operator-managed controller ServiceAccounts via FluxInstance.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  kustomize:
    patches:
      - target:
          kind: ServiceAccount
          name: kustomize-controller
        patch: |
          - op: add
            path: /metadata/annotations/eks.amazonaws.com~1role-arn
            value: arn:aws:iam::712671171381:role/flux-sops
      - target:
          kind: ServiceAccount
          name: helm-controller
        patch: |
          - op: add
            path: /metadata/annotations/eks.amazonaws.com~1role-arn
            value: arn:aws:iam::712671171381:role/flux-sops
      - target:
          kind: Deployment
          name: kustomize-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/env/-
            value:
              name: AWS_REGION
              value: us-east-2
          - op: add
            path: /spec/template/spec/containers/0/env/-
            value:
              name: AWS_DEFAULT_REGION
              value: us-east-2
      - target:
          kind: Deployment
          name: helm-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/env/-
            value:
              name: AWS_REGION
              value: us-east-2
          - op: add
            path: /spec/template/spec/containers/0/env/-
            value:
              name: AWS_DEFAULT_REGION
              value: us-east-2
