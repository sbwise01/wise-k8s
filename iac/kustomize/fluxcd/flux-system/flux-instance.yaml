apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.8.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  sync:
    kind: GitRepository
    name: flux-system
    url: ssh://git@github.com/sbwise01/wise-k8s
    ref: refs/heads/main
    path: ./iac/kustomize/fluxcd
    pullSecret: flux-system
    interval: 1m
  migrateResources: true
