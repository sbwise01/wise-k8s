apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
  annotations:
    index.home.bradandmarsha.com/enabled: "true"
    index.home.bradandmarsha.com/name: "Flux Web UI"
    index.home.bradandmarsha.com/image: "https://media.home.bradandmarsha.com/media/flux-operator.svg"
    index.home.bradandmarsha.com/description: "GitOps pipeline status and reconciliation dashboard"
    index.home.bradandmarsha.com/weight: "35"
spec:
  parentRefs:
    - name: gateway-internal
      namespace: kgateway-system
      sectionName: https-wildcard
  hostnames:
    - flux-web.home.bradandmarsha.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: flux-operator
          port: 9080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web-https-redirect
  namespace: flux-system
spec:
  parentRefs:
    - name: gateway-internal
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - flux-web.home.bradandmarsha.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
