# Phase 4 — RBAC for Gateway API HTTPRoute source
# (https://kubernetes-sigs.github.io/external-dns/v0.20.0/docs/sources/gateway-api/)
- op: add
  path: /rules/-
  value:
    apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
- op: add
  path: /rules/-
  value:
    apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "watch", "list"]
